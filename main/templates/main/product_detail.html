{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | J CSD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}?v=quantity-control-2">
</head>
<body class="product-page-body">
    <div class="product-page-shell">
        <header class="product-header">
            <div class="container d-flex justify-content-between align-items-center py-3">
                <a href="{% url 'home' %}" class="brand-mark product-brand">J CSD</a>
                <div class="product-header-actions">
                    <a class="admin-access-button cart-access-button" href="{% url 'cart' %}">
                        Cart{% if cart_count %} <span class="cart-count">{{ cart_count }}</span>{% endif %}
                    </a>
                    <a href="{% url 'home' %}" class="back-link">← Back</a>
                </div>
            </div>
        </header>

        <main class="container product-detail-wrap py-4 py-md-5">
            <div class="row align-items-center g-4 g-lg-5">
                <div class="col-12 col-lg-6">
                    <div class="product-gallery">
                        <img src="{{ product.image }}" alt="{{ product.name }}" class="product-detail-image">
                    </div>
                </div>

                <div class="col-12 col-lg-6">
                    <div class="product-info-panel">
                        <p class="product-badge">Featured flavour</p>
                        <h1>{{ product.name }}</h1>
                        <div class="product-meta-row">
                            <span>{{ product.volume }}</span>
                            <strong>₹{{ product.price }}</strong>
                        </div>
                        <p class="product-description">{{ product.description }}</p>

                        <div class="purchase-box">
                            <label for="quantity">Quantity</label>
                            <div class="quantity-row">
                                <button type="button" class="qty-btn" data-quantity-decrease aria-label="Decrease quantity">−</button>
                                <input id="quantity" type="number" value="1" min="1" step="1" inputmode="numeric">
                                <button type="button" class="qty-btn" data-quantity-increase aria-label="Increase quantity">+</button>
                            </div>
                            <div class="summary-row total-row">
                                <span>Subtotal</span>
                                <strong data-quantity-total data-unit-price="{{ product.price }}">₹{{ product.price }}</strong>
                            </div>
                        </div>

                        <div class="purchase-actions">
                            <a href="{% url 'checkout' product.id %}?qty=1" class="btn btn-buy">Buy now</a>
                            <form method="post" action="{% url 'add_to_cart' product.id %}" class="cart-add-form">
                                {% csrf_token %}
                                <input type="hidden" name="quantity" value="1" data-cart-quantity>
                                <button type="submit" class="btn btn-cart">Add to cart</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'main/product-detail.js' %}?v=cart-sync-1" defer></script>
</body>
</html>
