<style>
  .mobile-bottom-nav {
    display: none !important;
  }
  @media (max-width: 991.98px), (orientation: landscape) and (max-height: 540px) {
    body {
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)) !important;
    }
    .mobile-bottom-nav {
      display: flex !important;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(14, 18, 22, 0.65) !important;
      backdrop-filter: blur(28px) saturate(200%) contrast(95%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(200%) contrast(95%) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 -10px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.28) !important;
      z-index: 1080;
    }
  }
  @media (min-width: 992px) {
    .mobile-bottom-nav {
      display: none !important;
    }
  }
</style>

<nav class="mobile-bottom-nav d-lg-none" aria-label="Mobile Navigation">
  <a href="{% url 'home' %}" class="mobile-bottom-nav-item{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}" data-nav="home" aria-label="Home">
    <svg class="mobile-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"/>
      <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/>
      <path d="M9 21v-6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6"/>
    </svg>
    <span class="mobile-bottom-nav-label">Home</span>
  </a>

  <a href="{% url 'home' %}#shop" class="mobile-bottom-nav-item" data-nav="categories" aria-label="Categories">
    <svg class="mobile-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
    <span class="mobile-bottom-nav-label">Categories</span>
  </a>

  <a href="{% url 'about' %}" class="mobile-bottom-nav-item{% if request.resolver_match.url_name == 'about' %} is-active{% endif %}" data-nav="about" aria-label="About us">
    <svg class="mobile-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>
      <line x1="12" y1="16" x2="12" y2="12"/>
      <circle cx="12" cy="8" r="0.75" fill="currentColor"/>
    </svg>
    <span class="mobile-bottom-nav-label">About us</span>
  </a>

  {% if user.is_authenticated %}
    <a href="{% url 'customer_profile' %}" class="mobile-bottom-nav-item{% if request.resolver_match.url_name in 'customer_profile customer_orders' %} is-active{% endif %}" data-nav="profile" aria-label="Profile">
      {% if user.customer_profile.avatar %}
        <img src="{{ user.customer_profile.avatar.url }}" alt="{{ user.first_name|default:user.username }}" class="mobile-bottom-nav-avatar" width="22" height="22">
      {% else %}
        <svg class="mobile-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-1.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 19.5V21"/>
          <circle cx="12" cy="7.5" r="4"/>
        </svg>
      {% endif %}
      <span class="mobile-bottom-nav-label">Profile</span>
    </a>
  {% else %}
    <a href="{% url 'customer_login' %}" class="mobile-bottom-nav-item{% if request.resolver_match.url_name in 'customer_login customer_register' %} is-active{% endif %}" data-nav="login" aria-label="Login">
      <svg class="mobile-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-1.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 19.5V21"/>
        <circle cx="12" cy="7.5" r="4"/>
      </svg>
      <span class="mobile-bottom-nav-label">Login</span>
    </a>
  {% endif %}
</nav>

<script>
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    var isHome = window.location.pathname === '/' || window.location.pathname === '';
    var shopItem = document.querySelector('.mobile-bottom-nav-item[data-nav="categories"]');
    var homeItem = document.querySelector('.mobile-bottom-nav-item[data-nav="home"]');

    if (!isHome && shopItem) {
      if (window.location.hash === '#shop') {
        document.querySelectorAll('.mobile-bottom-nav-item').forEach(function(el) {
          el.classList.remove('is-active');
        });
        shopItem.classList.add('is-active');
      }
    }

    if (isHome) {
      var shopEl = document.getElementById('shop');
      function updateActive() {
        if (!shopEl) return;
        var rect = shopEl.getBoundingClientRect();
        if (rect.top <= window.innerHeight * 0.45 && rect.bottom >= window.innerHeight * 0.2) {
          if (homeItem) homeItem.classList.remove('is-active');
          if (shopItem) shopItem.classList.add('is-active');
        } else if (window.scrollY < 300) {
          if (shopItem) shopItem.classList.remove('is-active');
          if (homeItem) homeItem.classList.add('is-active');
        }
      }

      window.addEventListener('scroll', updateActive, { passive: true });
      if (window.location.hash === '#shop') {
        setTimeout(updateActive, 100);
      }

      if (shopItem) {
        shopItem.addEventListener('click', function(e) {
          if (shopEl) {
            e.preventDefault();
            shopEl.scrollIntoView({ behavior: 'smooth' });
            history.pushState(null, '', '#shop');
            document.querySelectorAll('.mobile-bottom-nav-item').forEach(function(el) {
              el.classList.remove('is-active');
            });
            shopItem.classList.add('is-active');
          }
        });
      }

      if (homeItem) {
        homeItem.addEventListener('click', function(e) {
          if (window.scrollY > 80) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            history.pushState(null, '', window.location.pathname);
            document.querySelectorAll('.mobile-bottom-nav-item').forEach(function(el) {
              el.classList.remove('is-active');
            });
            homeItem.classList.add('is-active');
          }
        });
      }
    }
  });
})();
</script>
